# Firebase App Hosting — backend Next.js (région : us-east4)
runConfig:
  minInstances: 0
  maxInstances: 4
  cpu: 1
  memoryMiB: 512
  concurrency: 80

env:
  - variable: SUPABASE_URL
    secret: SUPABASE_URL
  - variable: SUPABASE_SERVICE_ROLE_KEY
    secret: SUPABASE_SERVICE_ROLE_KEY
  - variable: ZOHO_SMTP_PASS
    secret: ZOHO_SMTP_PASS
  - variable: WEBHOOK_TOKEN
    secret: WEBHOOK_TOKEN
  # Jeton suivant, accepté aussi pendant le passage des webhooks à l'en-tête x-webhook-token (docs/autocalls-webhooks-migration.md).
  - variable: WEBHOOK_TOKEN_NEXT
    secret: WEBHOOK_TOKEN_NEXT
  # Clé Stripe restreinte (Customers : écriture) : langue des factures posée par le webhook Stripe.
  - variable: STRIPE_CUSTOMERS_KEY
    secret: STRIPE_CUSTOMERS_KEY
  - variable: ACCOUNT_CODE_SECRET
    secret: ACCOUNT_CODE_SECRET
  - variable: LEAD_WEBHOOK_COMMERCIAL
    secret: LEAD_WEBHOOK_COMMERCIAL
  - variable: LEAD_WEBHOOK_SUPPORT
    secret: LEAD_WEBHOOK_SUPPORT
  - variable: LEAD_WEBHOOKS_INTL
    secret: LEAD_WEBHOOKS_INTL
  - variable: ZOHO_SMTP_USER
    value: contact@permanenceia.com
  - variable: ZOHO_SMTP_HOST
    value: smtp.zoho.com
  - variable: NOTIFY_EMAIL
    value: contact@permanenceia.com
  - variable: AUTOCALLS_API_KEY
    secret: AUTOCALLS_API_KEY
  - variable: IDENTIFY_KEY
    secret: IDENTIFY_KEY
  # Webhook Stripe du compte Permanence IA (destination « permanenceia-site-relances ») : signature vérifiée.
  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET
  # Page « Mon compte » (/mon-compte) : clé Stripe RESTREINTE en lecture du compte Permanence IA (docs/mon-compte.md).
  # Ne décommenter qu’APRÈS avoir créé le secret et l’avoir accordé au backend voiceia, sinon chaque déploiement échoue.
  # Sans elle, la page affiche minutes et crédits, le forfait enregistré par le webhook Stripe ci-dessus s’il est en
  # base, et renvoie vers l’espace client (Billing info) pour la carte et les factures.
  # - variable: STRIPE_ACCOUNT_KEY
  #   secret: STRIPE_ACCOUNT_KEY
  # Relances commerciales (src/lib/relances) : planificateur Cloud Scheduler authentifié par jeton OIDC du compte
  # relances-cron (aucun rôle). Envoi réel depuis le 8 oct. 2026 (RELANCES_DRY_RUN à 0, accord du propriétaire) ; le remettre à 1 pour revenir
  # en mode test. Un rapport quotidien part à l'équipe. Marchés ouverts : RELANCES_LOCALES. Coupure immédiate : relance_settings.enabled.
  - variable: RELANCES_ENABLED
    value: "1"
  - variable: RELANCES_DRY_RUN
    value: "0"
  - variable: RELANCES_LOCALES
    value: fr,en-gb,en-au
  - variable: RELANCES_OIDC_AUDIENCE
    value: https://www.permanenceia.com/api/cron/relances
  - variable: RELANCES_OIDC_EMAIL
    value: relances-cron@snarecore-cacrs.iam.gserviceaccount.com
  # Adresses jamais relancées (comptes de test du propriétaire) : liste gardée hors du dépôt public.
  - variable: RELANCES_EXCLUDE_EMAILS
    secret: RELANCES_EXCLUDE_EMAILS
  # Lecture des réponses aux relances (IMAP Zoho, mot de passe d'application) : sans elle, aucun envoi marketing réel.
  - variable: RELANCES_IMAP_USER
    value: contact@permanenceia.com
  - variable: RELANCES_IMAP_HOST
    value: imappro.zoho.com
  - variable: RELANCES_IMAP_PASS
    secret: RELANCES_IMAP_PASS

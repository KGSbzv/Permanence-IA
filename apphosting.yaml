# Firebase App Hosting — backend Next.js (région : us-east4)
runConfig:
  minInstances: 0
  maxInstances: 4
  cpu: 1
  memoryMiB: 512
  concurrency: 80

env:
  - variable: SUPABASE_URL
    secret: SUPABASE_URL
  - variable: SUPABASE_SERVICE_ROLE_KEY
    secret: SUPABASE_SERVICE_ROLE_KEY
  - variable: ZOHO_SMTP_PASS
    secret: ZOHO_SMTP_PASS
  - variable: WEBHOOK_TOKEN
    secret: WEBHOOK_TOKEN
  - variable: ACCOUNT_CODE_SECRET
    secret: ACCOUNT_CODE_SECRET
  - variable: LEAD_WEBHOOK_COMMERCIAL
    secret: LEAD_WEBHOOK_COMMERCIAL
  - variable: LEAD_WEBHOOK_SUPPORT
    secret: LEAD_WEBHOOK_SUPPORT
  - variable: LEAD_WEBHOOKS_INTL
    secret: LEAD_WEBHOOKS_INTL
  - variable: ZOHO_SMTP_USER
    value: contact@permanenceia.com
  - variable: ZOHO_SMTP_HOST
    value: smtp.zoho.com
  - variable: NOTIFY_EMAIL
    value: contact@permanenceia.com
  - variable: AUTOCALLS_API_KEY
    secret: AUTOCALLS_API_KEY
  - variable: IDENTIFY_KEY
    secret: IDENTIFY_KEY

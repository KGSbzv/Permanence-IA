<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1640px;height:624px;overflow:hidden;font-family:Figtree,sans-serif;color:#fff;

.tag{font-family:Poppins;font-weight:600;font-size:40px;color:#5AD3EC;margin-top:14px;letter-spacing:-.5px}
.feat{font-size:27px;color:#cfe3f0;margin-top:22px;font-weight:500}
.url{position:absolute;right:330px;bottom:40px;font-size:24px;color:#9fc6d8;font-weight:600}

<svg class="wave" viewBox="0 0 1640 200" preserveAspectRatio="none">

<path d="M0 120 C300 60 500 180 820 110 S1340 60 1640 130"/>
<path d="M0 145 C300 90 520 200 820 135 S1340 90 1640 155" opacity=".6"/>
<path d="M0 170 C320 120 540 215 820 160 S1360 120 1640 180" opacity=".35"/>
</g></svg>
<div class="wrap"><img class="logo" src="logo.jpg">

<div class="feat">Answers every call&nbsp;&nbsp;•&nbsp;&nbsp;Books appointments&nbsp;&nbsp;•&nbsp;&nbsp;Qualifies leads</div></div></div>
<div class="url">permanenceia.com</div>
</body></html>
